[workspace]

[package]
name = "minigraf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
minigraf = { path = ".." }
tempfile = "3"
crc32fast = "1"
# ops_sequence includes tests/reference_model, shared with the model-based test.
proptest = "1"
uuid = { version = "1.0", features = ["v5"] }

[[bin]]
name = "wal_entry"
path = "fuzz_targets/wal_entry.rs"
test = false
doc = false

[[bin]]
name = "file_header"
path = "fuzz_targets/file_header.rs"
test = false
doc = false

[[bin]]
name = "fact_page"
path = "fuzz_targets/fact_page.rs"
test = false
doc = false

[[bin]]
name = "btree_page"
path = "fuzz_targets/btree_page.rs"
test = false
doc = false

[[bin]]
name = "datalog_parser"
path = "fuzz_targets/datalog_parser.rs"
test = false
doc = false

[[bin]]
name = "datalog_eval"
path = "fuzz_targets/datalog_eval.rs"
test = false
doc = false

[[bin]]
name = "ops_sequence"
path = "fuzz_targets/ops_sequence.rs"
test = false
doc = false

[[bin]]
name = "corrupt_file"
path = "fuzz_targets/corrupt_file.rs"
test = false
doc = false
