name: Lint

# rustfmt and clippy in one job: formatting takes a second once the toolchain
# is installed. Clippy lints the library and binary with every feature; tests,
# examples and benches are not linted (the panic-prevention lints in Cargo.toml
# would need thousands of changes there). A separate job lints the browser
# library on wasm32, including code that native builds do not compile.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Test acceptance evidence verification
        run: python3 -m unittest discover -s .github/acceptance -v

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

  wasm-clippy:
    name: Clippy (wasm32 browser library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Run clippy
        run: cargo clippy --target wasm32-unknown-unknown --features browser --lib -- -D warnings
