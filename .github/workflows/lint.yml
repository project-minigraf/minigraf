name: Lint

# rustfmt and clippy in one job: formatting takes a second once the toolchain
# is installed. Clippy lints all targets with every feature. clippy.toml scopes
# panic and indexing exemptions to tests; Cargo.toml keeps production denies.
# wasm.yml lints the wasm targets.

on:
  push:
    branches: [ "main", "v[0-9]*" ]
  pull_request:
    branches: [ "main", "v[0-9]*" ]

permissions:
  contents: read

jobs:
  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Test acceptance evidence verification
        run: python3 -m unittest discover -s .github/acceptance -v

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
