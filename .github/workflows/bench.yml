name: Nightly Benchmarks

# Two branches alternate every 12 hours: main at 02:00 UTC, v3 at 14:00 UTC.
# Scheduled runs always use this file from the default branch, so the branch
# under test is chosen from the cron string that fired. The run name carries
# the branch, so "Report regression" can find the previous run of the same
# branch. Keep the cron strings here and in BENCH_REF/run-name identical.
run-name: >-
  Nightly Benchmarks (${{ github.event_name == 'workflow_dispatch' && inputs.ref
  || (github.event.schedule == '0 14 * * *' && 'v3' || 'main') }})

on:
  schedule:
    - cron: '0 2 * * *'   # main
    - cron: '0 14 * * *'  # v3
  workflow_dispatch:       # allow manual runs
    inputs:
      ref:
        description: Branch to benchmark
        required: true
        default: main

      binding-ref:
        description: Binding ref for all P16 repos (phase B may select the PR branch)
        required: false
        default: v3

permissions:
  contents: read
  issues: write
  actions: read  # read the previous run's job logs to confirm an alert repeats

env:
  # One threshold per branch/testbed/measure; never race per-suite models.
  # 0.999 retains the noisy file/concurrency setting and existing testbed history.
  BENCH_THRESHOLD: "0.999"
  BENCH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || (github.event.schedule == '0 14 * * *' && 'v3' || 'main') }}

# One run at a time on the shared runners: a late run queues instead of
# overlapping the next branch's run.
concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  compile:
    name: bench / compile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BENCH_REF }}

      - name: Pin measured checkout
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Cache bench target
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-bench-target-${{ hashFiles('**/Cargo.lock', 'benches/**', 'src/**/*.rs') }}

      - name: Compile benchmarks
        run: cargo bench --bench minigraf_bench --no-run

      # --list calls every registration function, including fixture setup
      # outside benchmark closures. Pay that cost once, not in all 21 suites.
      - name: Enumerate benchmark IDs (untimed)
        run: |
          set -o pipefail
          CARGO_TERM_COLOR=never cargo bench --bench minigraf_bench -- --list \
            2>&1 | tee bench-list.txt

      - name: Share benchmark enumeration
        uses: actions/upload-artifact@v6
        with:
          name: bench-enumeration
          path: bench-list.txt
          if-no-files-found: error
          retention-days: 30

  benchmark:
    name: bench / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [compile]
    env:
      BENCH_SHA: ${{ needs.compile.outputs.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      BENCH_SUITE: ${{ matrix.name }}
      BENCH_FILTER: ${{ matrix.filter }}
      BENCH_FILE: ${{ matrix.file }}
    timeout-minutes: 360
    strategy:
      fail-fast: false   # one timeout must not cancel sibling jobs
      matrix:
        include:
          # ── Sequential: insert ──────────────────────────────────────────────
          - name: insert
            filter: "^insert/"
            file: bench_insert.txt

          # ── Sequential: insert_file ─────────────────────────────────────────
          - name: insert_file
            filter: "^insert_file/"
            file: bench_insert_file.txt

          # ── Sequential: query (includes query_extras) ───────────────────────
          - name: query
            filter: "^query/"
            file: bench_query.txt

          # P15 / G07: four enforcement on/off controls, 10k committed facts.
          # Accounting itself is always on. Reserve 2–5 job-minutes; timing
          # evidence is deferred to the serial phase-B dispatch.
          - name: memory_meter
            filter: "^memory_meter/"
            file: bench_memory_meter.txt
            required_case: '"memory_meter"'

          # P02: four existing execute cases plus eight preparation/cursor/slot
          # cases. Reserve 4–10 job-minutes pending phase-B timing.
          - name: prepared
            filter: "^prepared/"
            file: bench_prepared.txt
            v3_only: true

          # ── v3 committed history and retraction shortlist (Refs #776, P11) ──
          # 8 history IDs (all shapes, depths 1/2000) + 2 retract IDs (10k).
          # Reserve 3–10 job-minutes; phase B must verify the actual allowance.
          # btree_lookup/ stays excluded: these pending point/scan cases overlap
          # query/point_entity and query/point_attribute (C41 in the audit).
          - name: history_retract
            filter: "^(point_query_chain_depth/(churned_attr|sibling_attr|attr_scan|churned_attr_as_of)/(1|2000)|retract/(single_fact|batch_100)/10k)$"
            file: bench_history_retract.txt
            required_case: '"churned_attr_as_of"'

          # P10: six FactLog and four LogWriter IDs, v3 only (Refs #776).
          # Reserve 5–15 job-minutes; phase B supplies timing evidence.
          - name: fact_log
            filter: "^(fact_log|log_writer)/"
            file: bench_fact_log.txt
            required_case: '"tx_mixed_window_4096"'

          # ── Sequential: time_travel ─────────────────────────────────────────
          - name: time_travel
            filter: "^time_travel/"
            file: bench_time_travel.txt

          # ── Sequential: recursion ───────────────────────────────────────────
          - name: recursion
            filter: "^recursion/"
            file: bench_recursion.txt

          # ── Sequential: open ────────────────────────────────────────────────
          - name: open
            filter: "^open/"
            file: bench_open.txt

          # ── Sequential: checkpoint ──────────────────────────────────────────
          - name: checkpoint
            filter: "^checkpoint"
            file: bench_checkpoint.txt

          # ── Concurrent (in-memory): readers ────────────────────────────────
          - name: concurrent/readers
            filter: "^concurrent/readers/"
            file: bench_concurrent_readers.txt

          # ── Concurrent (in-memory): readers_plus_writer ────────────────────
          - name: concurrent/readers_plus_writer
            filter: "^concurrent/readers_plus_writer/"
            file: bench_concurrent_mixed.txt

          # ── Concurrent (in-memory): serialized_writers ─────────────────────
          - name: concurrent/serialized_writers
            filter: "^concurrent/serialized_writers/"
            file: bench_concurrent_writers.txt

          # ── Concurrent (file-backed): readers ──────────────────────────────
          - name: concurrent_file/readers
            filter: "^concurrent_file/readers/"
            file: bench_concurrent_file_readers.txt

          # ── Concurrent (file-backed): readers_plus_writer ──────────────────
          - name: concurrent_file/readers_plus_writer
            filter: "^concurrent_file/readers_plus_writer/"
            file: bench_concurrent_file_mixed.txt

          # ── Concurrent (file-backed): serialized_writers ───────────────────
          - name: concurrent_file/serialized_writers
            filter: "^concurrent_file/serialized_writers/"
            file: bench_concurrent_file_writers.txt

          # ── Concurrent: B+tree scan ─────────────────────────────────────────
          - name: concurrent_btree_scan
            filter: "^concurrent_btree_scan"
            file: bench_concurrent_btree_scan.txt

          # ── Negation: not / not-join ────────────────────────────────────────
          - name: negation
            filter: "^negation/"
            file: bench_negation.txt

          # ── Disjunction: or / or-join ───────────────────────────────────────
          - name: disjunction
            filter: "^disjunction/"
            file: bench_disjunction.txt

          # ── Aggregation (includes aggregation_extras) ───────────────────────
          - name: aggregation
            filter: "^aggregation/"
            file: bench_aggregation.txt

          # ── Expression filters / binding ────────────────────────────────────
          - name: expr
            filter: "^expr/"
            file: bench_expr.txt

          # ── Window functions ────────────────────────────────────────────────
          - name: window
            filter: "^window/"
            file: bench_window.txt

          # ── Bounded row frames (v3 only, #776 P01) ───────────────────────────
          # 18 existing IDs; reserve 5–15 job-minutes pending phase-B timing.
          # See docs/BENCHMARKS.md for the selection and remaining manual sweep.
          - name: window_rows
            filter: "^window_rows/((10000|100000)/(one|hundred)/sum/(zero|two|prefix)|100000/hundred/(min|max)/(two|prefix)|10000/hundred/frame_bench_sum/two|100000/hundred/frame_bench_sum/prefix)$"
            file: bench_window_rows.txt

          # ── Temporal metadata ───────────────────────────────────────────────
          - name: temporal_metadata
            filter: "^temporal_metadata/"
            file: bench_temporal_metadata.txt

          # ── User-defined functions ──────────────────────────────────────────
          - name: udf
            filter: "^udf/"
            file: bench_udf.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.compile.outputs.sha }}

      # Reporting follows the workflow revision, even if the measured ref has
      # not yet received these helpers (main/v3 companion rollout or old refs).
      - name: Checkout reporting tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .bench-workflow
          # Cone mode also includes root files such as Cargo.lock, changing
          # hashFiles cache keys relative to compile. Fetch only the helpers.
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/bench/
          persist-credentials: false

      # Inspect the actual checkout, including manual branches, tags and SHAs.
      - name: Select benchmark suite for checked-out source
        id: suite
        env:
          V3_ONLY: ${{ matrix.v3_only }}
          REQUIRED_CASE: ${{ matrix.required_case }}
        run: |
          enabled=true
          if [ "$V3_ONLY" = true ] && [ ! -f benches/minigraf_bench/prepared.rs ]; then
            enabled=false
            echo 'Skipping v3-only prepared suite: absent from checked-out source.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$REQUIRED_CASE" ]] && ! git grep -Fq "$REQUIRED_CASE" HEAD -- benches/; then
            enabled=false
            echo "Skipping $BENCH_SUITE: required v3 benchmark is absent from $BENCH_REF" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.suite.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        if: steps.suite.outputs.enabled == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Restore bench target
        if: steps.suite.outputs.enabled == 'true'
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ runner.os }}-bench-target-${{ hashFiles('**/Cargo.lock', 'benches/**', 'src/**/*.rs') }}

      # Inspect the actual checkout: manual refs can be branches, tags or SHAs.
      # Main has no row-frame group; skip its run and upload without empty data.
      - name: Check row-frame suite availability
        id: row_frames
        if: matrix.name == 'window_rows'
        run: |
          if git grep -q -F 'fn bench_window_rows(' HEAD -- benches/minigraf_bench.rs; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping window_rows: no row-frame suite in $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download benchmark enumeration
        uses: actions/download-artifact@v7
        with:
          name: bench-enumeration

      # Select from the shared listing without rerunning any fixture setup.
      # Every required matrix route must be nonempty before measurement starts.
      - name: Verify selected IDs
        if: steps.suite.outputs.enabled == 'true' && (matrix.name != 'window_rows' || steps.row_frames.outputs.available == 'true')
        run: node .bench-workflow/.github/bench/report.cjs select

      - name: Run benchmarks (${{ matrix.name }})
        id: benchmarks
        if: steps.suite.outputs.enabled == 'true' && (matrix.name != 'window_rows' || steps.row_frames.outputs.available == 'true')
        run: |
          set -o pipefail
          CARGO_TERM_COLOR=never cargo bench --bench minigraf_bench -- "$BENCH_FILTER" \
            2>&1 | tee "$BENCH_FILE"
          node .bench-workflow/.github/bench/report.cjs execution

      - name: Install Bencher CLI
        if: steps.benchmarks.outcome == 'success'
        uses: bencherdev/bencher@v0.4.25

      - name: Upload to Bencher
        id: bencher
        if: steps.benchmarks.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          # The t-test compares a run with the last 30 runs of its branch, not
          # all history. Without a window, a correct step change (#445's
          # predicate_pushdown, #476's checkpoint and wal_replay fixtures) kept
          # alerting for weeks; with 30, a lasting change alerts on about five
          # runs (enough for the two-in-a-row issue below), then becomes the
          # baseline.
          # Long-lived main/v3 histories must survive the other branch advancing.
          # --start-point main rebases the entire v3 head (including bindings)
          # when main changes, discarding independent v3 comparisons (#840).
          # Only ad hoc comparison branches inherit main's current history.
          start_point=()
          if [ "$BENCH_REF" != main ] && [ "$BENCH_REF" != v3 ]; then
            start_point=(--start-point main --start-point-clone-thresholds)
          fi
          bencher run \
            --project minigraf \
            --token "${{ secrets.BENCHER_API_TOKEN }}" \
            --branch "$BENCH_REF" \
            --hash "$BENCH_SHA" \
            "${start_point[@]}" \
            --testbed ubuntu-latest \
            --threshold-measure latency \
            --threshold-test t_test \
            --threshold-max-sample-size 30 \
            --threshold-upper-boundary "$BENCH_THRESHOLD" \
            --err \
            --adapter rust_criterion \
            --file "$BENCH_FILE" \
            2>&1 | tee bencher_out.txt

      # Shared CI runners are noisy, so one alert on its own is usually a slow
      # runner, not a regression. Report only benchmarks that also alerted in
      # this suite on the previous run. Each suite and branch has its own issue,
      # titled with the branch like the nightly fuzz issue: if one is open, add
      # a comment to it instead of skipping. Every outcome, including an alert
      # that is not reported, goes in the job summary, because the Bencher step
      # is continue-on-error; the final coverage check fails upload errors (#776).
      - name: Report regression
        if: steps.bencher.outcome == 'failure' && steps.suite.outputs.enabled == 'true'
        uses: actions/github-script@v9
        env:
          SUITE: ${{ matrix.name }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const suite = process.env.SUITE;
            const ref = process.env.BENCH_REF;
            const jobName = `bench / ${suite}`;
            const label = `${suite}, ${ref}`;

            // Bencher lists each alert as "- <benchmark> (Latency): <.../alerts/<id>>".
            // The "View results" lines use /perf? URLs, so they do not match.
            const alertRe = /- (\S+) \(Latency\): https:\/\/bencher\.dev\/console\/projects\/[^/\s]+\/alerts\//g;
            const parseAlerts = text => new Set([...text.matchAll(alertRe)].map(m => m[1]));

            const current = parseAlerts(fs.readFileSync('bencher_out.txt', 'utf8'));
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            let body;
            if (current.size === 0) {
              // Bencher failed without listing alerts (API or upload error).
              // Report it at once so a broken setup does not go unnoticed.
              body = [
                `Bencher failed in the nightly benchmark run (${label}) but listed no alerts. This is likely an API or upload error.`,
                '',
                `**Branch:** \`${ref}\``,
                `**Measured checkout:** \`${process.env.BENCH_SHA}\``,
                `**Run:** ${runUrl}`,
              ].join('\n');
            } else {
              // Find this suite's job in the previous completed run of the same
              // branch (by run name, see run-name) and read its alerts. Runs
              // from before the branch was in the run name count as main.
              let previous = new Set();
              let previousUrl = null;
              try {
                const { data: runs } = await github.rest.actions.listWorkflowRuns({
                  owner, repo,
                  workflow_id: 'bench.yml',
                  branch: 'main',
                  status: 'completed',
                  per_page: 20,
                });
                const runRef = r => {
                  const m = /\(([^)]+)\)$/.exec(r.display_title || '');
                  return m ? m[1] : 'main';
                };
                const prevRun = runs.workflow_runs.find(
                  r => r.id !== context.runId && runRef(r) === ref);
                if (prevRun) {
                  previousUrl = prevRun.html_url;
                  const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                    owner, repo, run_id: prevRun.id, per_page: 100,
                  });
                  const prevJob = jobs.jobs.find(j => j.name === jobName);
                  if (prevJob) {
                    const { data: log } = await github.rest.actions.downloadJobLogsForWorkflowRun({
                      owner, repo, job_id: prevJob.id,
                    });
                    previous = parseAlerts(typeof log === 'string' ? log : Buffer.from(log).toString('utf8'));
                  }
                }
              } catch (err) {
                core.warning(`Could not read the previous run's alerts: ${err.message}`);
              }

              const repeated = [...current].filter(b => previous.has(b)).sort();
              console.log(`Alerts this run: ${[...current].join(', ')}`);
              console.log(`Alerts in previous run: ${[...previous].join(', ') || 'none'}`);
              if (repeated.length === 0) {
                const msg = `Bencher flagged ${current.size} benchmark(s) in ${label}, but none alerted on the previous run too. Not reporting.`;
                core.warning(msg);
                await core.summary
                  .addHeading(`Benchmark alerts not reported (${label})`, 3)
                  .addRaw(msg, true)
                  .addList([...current].sort().map(b => `<code>${b}</code>`))
                  .write();
                return;
              }

              body = [
                `Bencher flagged these benchmarks in the nightly run (${label}) on two runs in a row:`,
                '',
                ...repeated.map(b => `- \`${b}\``),
                '',
                `**Branch:** \`${ref}\``,
                `**Measured checkout:** \`${process.env.BENCH_SHA}\``,
                `**Run:** ${runUrl}`,
                `**Previous run:** ${previousUrl}`,
                '',
                'Please review the Bencher dashboard to confirm the regression.',
              ].join('\n');
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'performance',
              state: 'open',
              per_page: 100,
            });
            const title = `Benchmark regression: ${suite} (${ref})`;
            // Issues for main used to be titled without the branch. Keep
            // commenting on such an open issue, and give it the new title.
            const legacyTitle = ref === 'main' ? `Benchmark regression: ${suite}` : null;
            const existing =
              openIssues.find(i => !i.pull_request && i.title === title) ||
              openIssues.find(i => !i.pull_request && legacyTitle && i.title === legacyTitle);
            let reported;
            if (existing) {
              if (existing.title !== title) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, title,
                });
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body,
              });
              reported = `Commented on #${existing.number}`;
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['performance'],
              });
              reported = `Opened #${issue.number}`;
            }
            core.warning(`${title}. ${reported}.`);
            await core.summary
              .addHeading(`Benchmark regression reported (${label})`, 3)
              .addRaw(`${reported}.`, true)
              .addBreak()
              .addRaw(body, true)
              .write();

      # Run even when selection, measurement or upload failed. Alerts keep the
      # existing two-run reporting policy; API/partial/empty uploads fail the job.
      - name: Verify reporting and summarize
        if: always() && (steps.suite.outputs.enabled == 'true' && (matrix.name != 'window_rows' || steps.row_frames.outputs.available == 'true'))
        env:
          BENCHER_OUTCOME: ${{ steps.bencher.outcome }}
        run: node .bench-workflow/.github/bench/report.cjs finish

      - name: Retain coverage evidence
        if: always() && (steps.suite.outputs.enabled == 'true' && (matrix.name != 'window_rows' || steps.row_frames.outputs.available == 'true'))
        uses: actions/upload-artifact@v6
        with:
          name: bench-evidence-${{ strategy.job-index }}
          retention-days: 30
          if-no-files-found: error
          path: |
            bench-list.txt
            bench-selection.json
            bench-report.json
            ${{ matrix.file }}
            bencher_out.txt

  # Actual foreign runtimes. Deliberately separate from Criterion/native history.
  # Reserve 5–15 minutes of measurement per binding plus build/setup, unverified.
  bindings:
    name: bench / binding_${{ matrix.binding }}
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { binding: python, repo: minigraf-python }
          - { binding: browser, repo: minigraf-wasm }
          - { binding: node, repo: minigraf-node }
          - { binding: c, repo: minigraf-c }
    env:
      BINDING: ${{ matrix.binding }}
      BINDING_REF: ${{ inputs.binding-ref || 'v3' }}
      BENCH_SHA: ${{ needs.compile.outputs.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compile.outputs.sha }}
      - name: Check v3 binding suite availability
        id: source
        run: |
          if [ -f benches/minigraf_bench/prepared.rs ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping v3-only binding jobs for this measured checkout.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        if: steps.source.outputs.enabled == 'true'
        with:
          ref: ${{ github.workflow_sha }}
          path: .bench-workflow
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/bench/
          persist-credentials: false
      - uses: actions/checkout@v7
        if: steps.source.outputs.enabled == 'true'
        with:
          repository: project-minigraf/${{ matrix.repo }}
          ref: ${{ inputs.binding-ref || 'v3' }}
          path: binding
          persist-credentials: false
      - name: Pin binding source
        if: steps.source.outputs.enabled == 'true'
        run: |
          set -o pipefail
          git -C binding rev-parse HEAD | tee binding-sha.txt
          history="$BENCH_REF"
          if [ "$BINDING_REF" != v3 ]; then
            history="binding-experiment/$BENCH_REF/$BINDING_REF"
          fi
          echo "BINDING_HISTORY=$history" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.source.outputs.enabled == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v6
        if: steps.source.outputs.enabled == 'true'
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        if: steps.source.outputs.enabled == 'true'
        with:
          node-version: '20'
      - name: Build binding with measured core
        if: steps.source.outputs.enabled == 'true'
        run: bash .bench-workflow/.github/bench/bindings.sh build "$BINDING"
      - name: Verify every binding case (untimed)
        if: steps.source.outputs.enabled == 'true'
        run: |
          set -o pipefail
          bash .bench-workflow/.github/bench/bindings.sh run "$BINDING" --test | tee binding-test.txt
      - name: Measure binding shortlist
        id: measurement
        if: steps.source.outputs.enabled == 'true'
        run: |
          set -o pipefail
          bash .bench-workflow/.github/bench/bindings.sh run "$BINDING" | tee binding-execution.txt
          node .bench-workflow/.github/bench/bindings-report.cjs validate
      - uses: bencherdev/bencher@v0.4.25
        if: steps.measurement.outcome == 'success'
      - name: Upload foreign runtime metrics
        id: bencher
        if: steps.measurement.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          bencher run --project minigraf --token "${{ secrets.BENCHER_API_TOKEN }}" \
            --branch "$BINDING_HISTORY" --hash "$BENCH_SHA" \
            --testbed "binding-$BINDING-ubuntu24-v1" \
            --threshold-measure latency --threshold-test t_test \
            --threshold-max-sample-size 30 --threshold-upper-boundary "$BENCH_THRESHOLD" \
            --err --adapter json --file binding/binding-results.json 2>&1 | tee binding-bencher.txt
      - name: Report regression
        if: steps.bencher.outcome == 'failure' && env.BINDING_REF == 'v3'
        uses: actions/github-script@v9
        env:
          SUITE: binding_${{ matrix.binding }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const suite = process.env.SUITE;
            const ref = process.env.BENCH_REF;
            const jobName = `bench / ${suite}`;
            const label = `${suite}, ${ref}`;

            // Bencher lists each alert as "- <benchmark> (Latency): <.../alerts/<id>>".
            // The "View results" lines use /perf? URLs, so they do not match.
            const alertRe = /- (\S+) \(Latency\): https:\/\/bencher\.dev\/console\/projects\/[^/\s]+\/alerts\//g;
            const parseAlerts = text => new Set([...text.matchAll(alertRe)].map(m => m[1]));

            const current = parseAlerts(fs.readFileSync('binding-bencher.txt', 'utf8'));
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            let body;
            if (current.size === 0) {
              // Bencher failed without listing alerts (API or upload error).
              // Report it at once so a broken setup does not go unnoticed.
              body = [
                `Bencher failed in the nightly benchmark run (${label}) but listed no alerts. This is likely an API or upload error.`,
                '',
                `**Branch:** \`${ref}\``,
                `**Measured checkout:** \`${process.env.BENCH_SHA}\``,
                `**Run:** ${runUrl}`,
              ].join('\n');
            } else {
              // Find this suite's job in the previous completed run of the same
              // branch (by run name, see run-name) and read its alerts. Runs
              // from before the branch was in the run name count as main.
              let previous = new Set();
              let previousUrl = null;
              try {
                const { data: runs } = await github.rest.actions.listWorkflowRuns({
                  owner, repo,
                  workflow_id: 'bench.yml',
                  branch: 'main',
                  status: 'completed',
                  per_page: 20,
                });
                const runRef = r => {
                  const m = /\(([^)]+)\)$/.exec(r.display_title || '');
                  return m ? m[1] : 'main';
                };
                const prevRun = runs.workflow_runs.find(
                  r => r.id !== context.runId && runRef(r) === ref);
                if (prevRun) {
                  previousUrl = prevRun.html_url;
                  const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                    owner, repo, run_id: prevRun.id, per_page: 100,
                  });
                  const prevJob = jobs.jobs.find(j => j.name === jobName);
                  if (prevJob) {
                    const { data: log } = await github.rest.actions.downloadJobLogsForWorkflowRun({
                      owner, repo, job_id: prevJob.id,
                    });
                    previous = parseAlerts(typeof log === 'string' ? log : Buffer.from(log).toString('utf8'));
                  }
                }
              } catch (err) {
                core.warning(`Could not read the previous run's alerts: ${err.message}`);
              }

              const repeated = [...current].filter(b => previous.has(b)).sort();
              console.log(`Alerts this run: ${[...current].join(', ')}`);
              console.log(`Alerts in previous run: ${[...previous].join(', ') || 'none'}`);
              if (repeated.length === 0) {
                const msg = `Bencher flagged ${current.size} benchmark(s) in ${label}, but none alerted on the previous run too. Not reporting.`;
                core.warning(msg);
                await core.summary
                  .addHeading(`Benchmark alerts not reported (${label})`, 3)
                  .addRaw(msg, true)
                  .addList([...current].sort().map(b => `<code>${b}</code>`))
                  .write();
                return;
              }

              body = [
                `Bencher flagged these benchmarks in the nightly run (${label}) on two runs in a row:`,
                '',
                ...repeated.map(b => `- \`${b}\``),
                '',
                `**Branch:** \`${ref}\``,
                `**Measured checkout:** \`${process.env.BENCH_SHA}\``,
                `**Run:** ${runUrl}`,
                `**Previous run:** ${previousUrl}`,
                '',
                'Please review the Bencher dashboard to confirm the regression.',
              ].join('\n');
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'performance',
              state: 'open',
              per_page: 100,
            });
            const title = `Benchmark regression: ${suite} (${ref})`;
            // Issues for main used to be titled without the branch. Keep
            // commenting on such an open issue, and give it the new title.
            const legacyTitle = ref === 'main' ? `Benchmark regression: ${suite}` : null;
            const existing =
              openIssues.find(i => !i.pull_request && i.title === title) ||
              openIssues.find(i => !i.pull_request && legacyTitle && i.title === legacyTitle);
            let reported;
            if (existing) {
              if (existing.title !== title) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, title,
                });
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body,
              });
              reported = `Commented on #${existing.number}`;
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['performance'],
              });
              reported = `Opened #${issue.number}`;
            }
            core.warning(`${title}. ${reported}.`);
            await core.summary
              .addHeading(`Benchmark regression reported (${label})`, 3)
              .addRaw(`${reported}.`, true)
              .addBreak()
              .addRaw(body, true)
              .write();

      - name: Verify binding reporting
        if: always() && steps.source.outputs.enabled == 'true'
        env:
          BENCHER_OUTCOME: ${{ steps.bencher.outcome }}
        run: node .bench-workflow/.github/bench/bindings-report.cjs finish
      - name: Retain binding evidence
        if: always() && steps.source.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: binding-evidence-${{ matrix.binding }}
          retention-days: 30
          if-no-files-found: error
          path: |
            binding-sha.txt
            binding-test.txt
            binding-execution.txt
            binding-bencher.txt
            binding-report.json
            binding/binding-results.json
            binding/target-metadata.json
