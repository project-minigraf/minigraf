name: Smoke Suite (nightly)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Long-haul smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run smoke suite
        run: cargo test --test smoke_test -- --include-ignored --nocapture
        env:
          RUST_BACKTRACE: 1

      - name: Size per fact at 1M facts (spec §11)
        run: cargo test --lib size_per_fact_in_433_shape_1m -- --include-ignored --nocapture
        env:
          RUST_BACKTRACE: 1

  # #548: a recursive rule deriving about 5M facts completes, and its peak
  # RSS follows the derived relation.
  recursive-acceptance:
    name: Recursive rules at 5M derived facts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run the acceptance test
        run: cargo test --profile bench --test recursive_acceptance_test -- --ignored --nocapture
        env:
          RUST_BACKTRACE: 1
