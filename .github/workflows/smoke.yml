name: Smoke Suite (nightly)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Long-haul smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run smoke suite
        run: cargo test --test smoke_test -- --include-ignored --nocapture
        env:
          RUST_BACKTRACE: 1

      - name: Size per fact at 1M facts (spec §11)
        run: cargo test --lib size_per_fact_in_433_shape_1m -- --include-ignored --nocapture
        env:
          RUST_BACKTRACE: 1

  # #548: a recursive rule deriving about 5M facts completes, and its peak
  # RSS follows the derived relation.
  recursive-acceptance:
    name: Recursive rules at 5M derived facts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run the acceptance test
        run: cargo test --profile bench --test recursive_acceptance_test -- --ignored --nocapture
        env:
          RUST_BACKTRACE: 1

  # #549 / #575: 1M aggregate groups complete or stop with QRY-012 under a
  # limit; a 13-pattern cartesian product streams in a few MiB. Without
  # test-oracle: the executor would run out of memory on the product.
  memory-limit-acceptance:
    name: Query memory limit acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run the acceptance tests
        run: cargo test --profile bench --test memory_limit_acceptance_test -- --ignored --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1

  # #550: a 1M-fact transact holds at most one chunk of facts and commits as
  # a checkpoint; peak RSS is printed. test-oracle: the statement reader's
  # high-water mark.
  large-transaction-acceptance:
    name: Large transaction acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run the acceptance test
        run: cargo test --profile bench --features test-oracle --test large_transaction_acceptance_test -- --ignored --nocapture
        env:
          RUST_BACKTRACE: 1
