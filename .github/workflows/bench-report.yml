name: Benchmark reporting checks

on:
  push:
    branches: [main, 'v[0-9]*']
    paths: ['.github/bench/**', '.github/workflows/bench*.yml', 'benchmarks/bindings839/**']
  pull_request:
    branches: [main, 'v[0-9]*']
    paths: ['.github/bench/**', '.github/workflows/bench*.yml', 'benchmarks/bindings839/**']

permissions:
  contents: read

jobs:
  reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test .github/bench/*.test.cjs
      - run: python3 -I -m unittest discover -s benchmarks/bindings839 -p 'test_*.py'
        if: ${{ hashFiles('benchmarks/bindings839/test_*.py') != '' }}
