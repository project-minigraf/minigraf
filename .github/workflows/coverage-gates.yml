name: Coverage Gates

on:
  push:
    branches: [ "main", "v[0-9]*" ]
  pull_request:
    branches: [ "main", "v[0-9]*" ]

permissions:
  contents: read

jobs:
  coverage-gates:
    name: Per-module coverage gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Branch coverage needs nightly. Pinned so a toolchain update cannot move
      # the numbers under an unrelated PR; bump it on purpose and re-measure.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-01
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Build the pid_ns_helper example used by lock tests
        # cargo-llvm-cov puts test binaries where the lock tests' lookup of
        # examples/ next to the test binary fails; same workaround as
        # llvm-cov.yml.
        run: cargo build --examples --target-dir /tmp/minigraf-lock-test-examples

      # A failing test fails the job: a partial report must never be gated.
      - name: Run the tests with branch coverage
        env:
          MINIGRAF_PID_NS_HELPER: /tmp/minigraf-lock-test-examples/debug/examples/pid_ns_helper
        run: cargo llvm-cov --branch --no-report

      - name: Summarize coverage
        run: cargo llvm-cov report --branch --json --summary-only --output-path coverage.json

      # Thresholds come from coverage-thresholds.toml (#396).
      - name: Check per-module thresholds
        run: python3 scripts/coverage_gates.py coverage-thresholds.toml coverage.json
