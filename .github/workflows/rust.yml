name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # Builds the docs the way docs.rs does: cargo-docs-rs reads
  # [package.metadata.docs.rs] in Cargo.toml (features, rustdoc args) and uses
  # nightly, as docs.rs does. One job per target there; keep the two lists equal.
  docs-check:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, wasm32-unknown-unknown]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@nightly
      with:
        targets: ${{ matrix.target }}
    - uses: dtolnay/install@cargo-docs-rs
    - name: Check docs.rs build
      run: cargo docs-rs --target ${{ matrix.target }}
