name: Rust

on:
  push:
    branches: [ "main", "v[0-9]*" ]
  pull_request:
    branches: [ "main", "v[0-9]*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  docs-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@nightly
    - name: Check docs.rs build
      env:
        RUSTDOCFLAGS: "--cfg docsrs"
      run: cargo doc --all-features --no-deps

  # The streaming engine (#473) runs beside the existing executor until #551.
  # With this feature every query the engine runs is also run by the executor,
  # and a different answer fails the test, so the whole suite (model-based,
  # property, golden corpus, integration) checks the engine.
  oracle:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run tests with the executor as the engine's oracle
      run: cargo test --features test-oracle
