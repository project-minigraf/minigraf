name: Rust

on:
  push:
    branches: [ "main", "v[0-9]*" ]
  pull_request:
    branches: [ "main", "v[0-9]*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # Builds the docs the way docs.rs does: cargo-docs-rs reads
  # [package.metadata.docs.rs] in Cargo.toml (features, rustdoc args) and uses
  # nightly, as docs.rs does. One job per target there; keep the two lists equal.
  docs-check:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, wasm32-unknown-unknown]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: dtolnay/rust-toolchain@nightly
      with:
        targets: ${{ matrix.target }}
    - uses: dtolnay/install@cargo-docs-rs
    - name: Check docs.rs build
      run: cargo docs-rs --target ${{ matrix.target }}

  # The tests that need the test-only switches: plan independence (#596),
  # forced `not`/`or` body forms (#546) and small transaction chunks (#550)
  # in the model-based, property and crash tests.
  test-hooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run tests with the test-only switches
      run: cargo test --features test-hooks
