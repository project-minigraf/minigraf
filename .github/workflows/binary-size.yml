name: Binary Size

on:
  push:
    branches: [ "main", "v[0-9]*" ]
  pull_request:
    branches: [ "main", "v[0-9]*" ]

permissions:
  contents: read

jobs:
  binary-size:
    name: Check distribution binary size
    runs-on: ubuntu-latest
    env:
      SIZE_LIMIT_BYTES: 1263616  # 1234 KiB — #277 error codes, #306 top-k, #723 ancestor join planning; see PHILOSOPHY.md §4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The profile cargo-dist ships (#796)
      - name: Build distribution binary
        run: cargo build --profile dist

      - name: Check binary size
        run: |
          BINARY=target/dist/minigraf
          SIZE=$(stat -c %s "$BINARY")
          SIZE_KB=$(( SIZE / 1024 ))
          LIMIT_KB=$(( SIZE_LIMIT_BYTES / 1024 ))
          echo "Binary size: ${SIZE_KB} KiB (limit: ${LIMIT_KB} KiB)"
          if [ "$SIZE" -gt "$SIZE_LIMIT_BYTES" ]; then
            echo "FAIL: binary size ${SIZE_KB} KiB exceeds limit of ${LIMIT_KB} KiB"
            exit 1
          fi
          echo "OK: binary is within size limit"
