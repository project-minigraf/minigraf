name: Policy

# Release-policy checks (#395):
#   - msrv:          the crate builds and its unit tests pass on `rust-version`
#   - semver-checks: no accidental public-API break against the latest release tag
#                    (on a major-version branch: the API changes each PR makes)
#   - cargo-deny:    dependency advisories (RustSec), licenses, duplicate versions
#                    and sources (deny.toml); also weekly, for new advisories
#   - golden-corpus: golden files in tests/golden/ are only ever added (#391)

on:
  push:
    branches: [ "main", "v[0-9]*" ]
  pull_request:
    # Major-version branches (e.g. `v3`) run the same checks, but a semver
    # break is allowed there — see the semver-checks job.
    branches: [ "main", "v[0-9]*" ]
  # A new advisory can land without a change here (default branch only).
  schedule:
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV (Rust 1.89)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      MSRV: "1.89"
      # Resolve dependencies to versions that support our rust-version, so a
      # new upstream release cannot break the MSRV build on its own.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check MSRV matches Cargo.toml
        run: |
          declared=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$declared" != "$MSRV" ]; then
            echo "::error::Cargo.toml rust-version is $declared but this job tests $MSRV; update policy.yml"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - name: Check (all features)
        run: cargo check --all-features

      - name: Run unit tests
        run: cargo test --lib

  semver-checks:
    name: Public API semver check
    # On `main` every push and PR is checked against the latest release tag,
    # and a break fails it. A major-version branch (e.g. `v3`) may break the
    # API, and its tags stop at the split from `main`, so a PR to it is checked
    # against its base instead: the job shows exactly the API changes that PR
    # makes (for the CHANGELOG), without failing it. Pushes there are skipped.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the baseline
        id: baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != main ]; then
            # The PR checkout is the merge of the PR into its base; its first
            # parent is the base as merged, so only the PR's changes show.
            rev=$(git rev-parse HEAD^1)
            echo "Baseline: $BASE_REF at $rev"
          else
            rev=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
            echo "Baseline: $rev"
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Run cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ steps.baseline.outputs.rev }}

  cargo-deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      - name: Record weekly failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Weekly dependency check failure"
        run: |
          body="The weekly cargo-deny run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (commit $GITHUB_SHA)."
          existing_issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$ISSUE_TITLE in:title" --json number,title --limit 100 \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          fi

  golden-corpus:
    name: Golden files are add-only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse modified, deleted or renamed golden files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only --diff-filter=MDRT "origin/${BASE_REF}...HEAD" -- \
            'tests/golden/*.graph' 'tests/golden/*.wal')
          if [ -n "$changed" ]; then
            echo "::error::Golden files are never regenerated, only added (tests/golden/README.md):"
            echo "$changed"
            exit 1
          fi
