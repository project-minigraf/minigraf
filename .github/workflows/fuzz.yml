name: Fuzz (nightly)

# Two branches alternate every 12 hours: main at 04:00 UTC, v3 at 16:00 UTC.
# Scheduled runs always use this file from the default branch, so the branch
# under test is chosen from the cron string that fired (as in bench.yml).
# Keep the cron strings here and in FUZZ_REF/run-name identical, and keep this
# file the same on main and v3.
#
# Each target runs in its own job, in parallel. The corpus a run grows is saved
# in the Actions cache per branch and target, and the next run starts from it
# (#387). fuzz-corpus.yml minimizes it weekly and proposes it as a commit.
run-name: >-
  Fuzz (${{ github.event_name == 'workflow_dispatch' && inputs.ref
  || (github.event.schedule == '0 16 * * *' && 'v3' || 'main') }})

on:
  schedule:
    - cron: "0 4 * * *"   # main
    - cron: "0 16 * * *"  # v3
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to fuzz
        required: true
        default: main
      seconds:
        description: Seconds per target
        required: true
        default: "3300"

permissions:
  contents: read

env:
  FUZZ_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || (github.event.schedule == '0 16 * * *' && 'v3' || 'main') }}
  FUZZ_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seconds || '3300' }}

jobs:
  targets:
    name: List fuzz targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FUZZ_REF }}

      # Each branch fuzzes the targets its own fuzz/Cargo.toml declares.
      - name: Read the [[bin]] names
        id: list
        shell: bash
        run: |
          targets="$(sed -n 's/^name = "\(.*\)"$/\1/p' fuzz/Cargo.toml | grep -vx minigraf-fuzz \
            | jq -R . | jq -sc .)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Targets on $FUZZ_REF: $targets"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FUZZ_REF }}

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo-fuzz binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: which cargo-fuzz || cargo install cargo-fuzz

      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ env.FUZZ_REF }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ env.FUZZ_REF }}-${{ matrix.target }}-

      - name: Build
        run: cargo fuzz build -O ${{ matrix.target }}

      # -timeout: one input running this long is a hang (libFuzzer's default
      # of 1200 s would spend a third of the budget on it).
      - name: Fuzz ${{ matrix.target }}
        shell: bash
        run: |
          set -o pipefail
          cargo fuzz run -O ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- \
            -max_total_time="$FUZZ_SECONDS" -timeout=60 2>&1 | tee fuzz-${{ matrix.target }}.log

      - name: Save corpus
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ env.FUZZ_REF }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz-${{ matrix.target }}.log
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Record fuzz failures
    needs: fuzz
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fuzz-failure-*
          path: failures

      - name: Open or update the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "Nightly fuzz failure (${{ env.FUZZ_REF }})"
        run: |
          report_file="fuzz-failure.md"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "The nightly fuzz workflow found one or more failures on \`$FUZZ_REF\`."
            echo
            echo "- Run and artifacts: $run_url"
            echo "- Reproduce: check out \`$FUZZ_REF\` at the run's commit, then"
            echo "  \`cargo +nightly fuzz run <target> fuzz/artifacts/<target>/<crash-file>\`"
            echo
            echo "## Fuzz logs (failed targets only, last 100 lines each)"
            echo
            shopt -s nullglob
            for log in failures/fuzz-failure-*/fuzz-*.log; do
              echo "### $(basename "$log")"
              echo
              echo '```text'
              tail -n 100 "$log"
              echo '```'
              echo
            done
          } > "$report_file"

          # GitHub issue and comment bodies max out at 65536 characters.
          max_bytes=60000
          if [ "$(wc -c < "$report_file")" -gt "$max_bytes" ]; then
            head -c "$max_bytes" "$report_file" > "${report_file}.tmp"
            {
              echo
              echo "..."
              echo
              echo "_Report truncated to fit GitHub's body size limit. See the run linked above for full logs._"
            } >> "${report_file}.tmp"
            mv "${report_file}.tmp" "$report_file"
          fi

          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$ISSUE_TITLE in:title" \
            --json number,title \
            --limit 100 \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" \
            | head -n 1)"

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body-file "$report_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$report_file"
          fi
          exit 1
