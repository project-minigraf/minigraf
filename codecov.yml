codecov:
  require_ci_to_pass: false

# Fuzz harnesses run under cargo-fuzz, never under cargo test, so their lines
# can only show as uncovered.
ignore:
  - "fuzz/**"

# The report is cargo-llvm-cov's, from coverage-gates.yml. The project target
# is the whole-crate line floor in coverage-thresholds.toml; that workflow's
# gate is the one that fails CI.
coverage:
  status:
    project:
      default:
        target: 94%
        threshold: 1%
    patch:
      default:
        target: 85%
        threshold: 2%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
