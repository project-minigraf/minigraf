codecov:
  require_ci_to_pass: false

# Fuzz harnesses run under cargo-fuzz, never under cargo test, so their lines
# can only show as uncovered.
ignore:
  - "fuzz/**"

coverage:
  status:
    project:
      default:
        target: 75%
        threshold: 2%
    patch:
      default:
        target: 75%
        threshold: 2%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
