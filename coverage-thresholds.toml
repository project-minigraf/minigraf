# Coverage floors, whole crate and per file, checked on every push and PR by
# .github/workflows/coverage-gates.yml (scripts/coverage_gates.py). The single
# source of truth for the gates (#396).
#
# Percentages of lines and branches covered by `cargo llvm-cov --branch` with
# the nightly pinned in that workflow, test modules included. Each floor is
# the measured value rounded down, minus one point of slack (none at 100%).
# A floor only goes up: raise it in the PR that adds the tests, and lower one
# only with the reason in the PR. Target for the storage and WAL files: 90%
# branches.
#
# Known uncovered paths, left on purpose:
# - INT-049 bails in btree.rs and persistent_facts.rs (separators that do not
#   fit in an internal node, which one pass always avoids, see
#   write_internal_pieces; an empty level; a migration backup page at the wrong
#   id; a rebuilt index or dictionary failing its own check): invariant checks
#   that no input reaches without a bug elsewhere.
# - btree.rs `let ... else` on a leaf group (pack_leaves never returns an
#   empty one) and on `nodes.next()` right after a successful `peek()`.
# - btree.rs `collect_leaf_pages` (test only) depth check: a cycle trips its
#   visit count first.
# - persistent_facts.rs `check_fits` / `check_written` with
#   `holds_every_page() == false`: only the browser buffer, covered by the
#   wasm tests in wasm.yml, which this job does not measure.
# - wal.rs `delete_file` retry sleep: Windows only (one attempt elsewhere).
# - wal.rs `scan_entries` read error other than EOF: needs a failing read on a
#   regular file, which the fault plan (storage/fault.rs) does not inject.

# The whole crate, all files measured (fuzz/ is not built by cargo test).
# Codecov's project status (codecov.yml) uses the same line floor.
