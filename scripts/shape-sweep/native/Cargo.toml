[package]
name = "shape-sweep"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
minigraf = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

